<style>
  .kpi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
               gap: 16px; margin-bottom: 18px; }

  .kpi-head .who { font-weight: 700; font-size: 16px; }
  .kpi-head .where { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .rank { font-size: 12px; color: var(--faint); font-weight: 700; }
  .score { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .score small { font-size: 13px; font-weight: 600; color: var(--muted); }
  .score.none { font-size: 13.5px; font-weight: 600; color: var(--warn); line-height: 1.35; }
  .mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px;

  .mezon:last-child { border-bottom: 0; }

  details.tarkib[open] summary { color: var(--ink); }
