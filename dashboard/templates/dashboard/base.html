{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sevimli Kassa{% endblock %}</title>
  <style>
    /*
      Sevimli Kassa paneli.

      Ranglar logotipdan olingan: to'q sharob (burgundiya) — brend, va
      oltin-sariq — logotipdagi savat rangi. Ikkinchi rang bo'lgani uchun
      panel «bir rangli» bo'lib qolmaydi: muhim raqamlar sariq bilan,
      ogohlantirishlar sariq-jigarrang bilan ajratiladi.

      Fon iliq kulrang (sof oq emas) — kun bo'yi qaraydigan ekran uchun
      ko'z kamroq charchaydi.
    */
    :root {
      /* brend */
      --wine:        #8E1F2F;
      --wine-deep:   #5E1220;
      --wine-dark:   #7A1A28;
      --wine-soft:   #FBF0F1;
      --gold:        #D99A2B;
      --gold-deep:   #A8741A;
      --gold-soft:   #FDF4E4;

      /* matn */
      --ink:         #1B1618;
      --ink-soft:    #46403F;
      --muted:       #756D6B;
      --faint:       #9C9491;

      /* yuza */
      --bg:          #F6F4F1;
      --surface:     #FFFFFF;
      --surface-2:   #FBFAF8;
      --line:        #ECE8E2;
      --line-strong: #DAD4CC;

      /* holat */
      --ok:          #1B7F55;   --ok-soft:     #E6F4ED;
      --warn:        #A8741A;   --warn-soft:   #FDF4E4;
      --danger:      #B3261E;   --danger-soft: #FBEDEB;
      --info:        #2A6B96;   --info-soft:   #EAF3F8;

      --radius:      14px;
      --shadow:      0 1px 2px rgba(27,22,24,.04), 0 8px 24px rgba(27,22,24,.06);
      --sidebar:     248px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 15px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--wine); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .num { font-variant-numeric: tabular-nums; }

    /* ---------------------------------------------------------- karkas */
    .shell { display: flex; min-height: 100%; }

    aside.nav {
      width: var(--sidebar); flex: 0 0 var(--sidebar);
      background: linear-gradient(170deg, var(--wine) 0%, var(--wine-deep) 100%);
      color: #fff; display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
    }
    aside.nav .brand {
      padding: 22px 22px 18px; display: flex; align-items: center; gap: 11px;
    }
    aside.nav .brand .mark {
      width: 34px; height: 34px; border-radius: 10px; flex: 0 0 34px;
      background: var(--gold); color: #4A2E05;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 17px; letter-spacing: -.5px;
    }
    aside.nav .brand .name { font-weight: 700; font-size: 16.5px; letter-spacing: .2px; }
    aside.nav .brand .sub  { font-size: 11.5px; color: #E8B8BF; margin-top: -3px; }

    aside.nav .group {
      font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px;
      text-transform: uppercase; color: #D79AA3;
      padding: 16px 22px 7px;
    }
    aside.nav a.item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 22px; color: #F0D6DA; font-size: 14.5px; font-weight: 500;
      border-left: 3px solid transparent; text-decoration: none;
    }
    aside.nav a.item .ico { width: 18px; text-align: center; opacity: .85; font-size: 15px; }
    aside.nav a.item:hover { background: rgba(255,255,255,.07); color: #fff; text-decoration: none; }
    aside.nav a.item.on {
      background: rgba(255,255,255,.12); color: #fff; font-weight: 600;
      border-left-color: var(--gold);
    }
    aside.nav a.item.on .ico { opacity: 1; }
    aside.nav .spacer { flex: 1; }
    aside.nav .foot {
      padding: 14px 22px 18px; font-size: 12px; color: #C98B95;
      border-top: 1px solid rgba(255,255,255,.12);
    }
    aside.nav .foot a { color: #EBC3C9; }

    main.body { flex: 1; min-width: 0; }
    header.top {
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 0 30px; height: 62px; display: flex; align-items: center; gap: 16px;
      position: sticky; top: 0; z-index: 5;
    }
    header.top .crumb { font-size: 15px; font-weight: 600; }
    header.top .when { margin-left: auto; color: var(--muted); font-size: 13.5px; }

    .wrap { max-width: 1280px; padding: 26px 30px 60px; }

    h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -.4px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    h2 {
      font-size: 13px; margin: 32px 0 12px; font-weight: 700;
      letter-spacing: .9px; text-transform: uppercase; color: var(--faint);
    }

    /* --------------------------------------------------------- xabarlar */
    .alert {
      border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px;
      font-size: 14.5px; display: flex; gap: 12px; align-items: flex-start;
      border: 1px solid transparent;
    }
    .alert span:first-child {
      flex: 0 0 22px; height: 22px; border-radius: 50%; font-size: 13px;
      display: flex; align-items: center; justify-content: center; color: #fff;
      font-weight: 700;
    }
    .alert.err  { background: var(--danger-soft); border-color: #F0CFCB; color: #7C1B15; }
    .alert.err  span:first-child { background: var(--danger); }
    .alert.warn { background: var(--warn-soft);   border-color: #EFDCB6; color: #6E4A11; }
    .alert.warn span:first-child { background: var(--gold); }
    .alert.ok   { background: var(--ok-soft);     border-color: #C4E4D4; color: #12583B; }
    .alert.ok   span:first-child { background: var(--ok); }
    .alert b { display: block; margin-bottom: 2px; }

    /* ------------------------------------------------------------ plita */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .tile {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .tile::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--line-strong);
    }
    .tile .label {
      font-size: 11px; font-weight: 700; letter-spacing: .9px;
      color: var(--faint); text-transform: uppercase;
    }
    .tile .value { font-size: 27px; font-weight: 700; margin-top: 4px; letter-spacing: -.7px; }
    .tile .note  { font-size: 13px; color: var(--muted); margin-top: 1px; }

    .tile.hero {
      background: linear-gradient(140deg, var(--wine) 0%, var(--wine-deep) 100%);
      border-color: transparent; color: #fff;
    }
    .tile.hero::before { background: var(--gold); }
    .tile.hero .label { color: #EFB9C1; }
    .tile.hero .value { color: #fff; }
    .tile.hero .note  { color: #E9B6BE; }

    .tile.gold::before   { background: var(--gold); }
    .tile.gold .value    { color: var(--gold-deep); }
    .tile.good::before   { background: var(--ok); }
    .tile.good .value    { color: var(--ok); }
    .tile.bad::before    { background: var(--danger); }
    .tile.bad .value     { color: var(--danger); }

    /* ---------------------------------------------------------- jadval */
    table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    }
    th {
      text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .9px;
      color: var(--faint); text-transform: uppercase; padding: 12px 16px;
      background: var(--surface-2); border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr:last-child td, tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FCFBF9; }
    td.right, th.right { text-align: right; }
    td.actions { white-space: nowrap; text-align: right; }
    td.tight, th.tight { white-space: nowrap; }
    tr.total td { background: var(--surface-2); font-weight: 700; }

    /* ---------------------------------------------------------- nishon */
    .badge {
      display: inline-block; font-size: 12px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px; white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge.ok   { color: var(--ok);     background: var(--ok-soft);     border-color: #C6E5D6; }
    .badge.warn { color: var(--warn);   background: var(--warn-soft);   border-color: #EEDCB8; }
    .badge.err  { color: var(--danger); background: var(--danger-soft); border-color: #F1D0CC; }
    .badge.off  { color: var(--muted);  background: #F0EDE9;            border-color: #E3DED7; }

    .sec { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); padding: 26px; text-align: center; }

    pre.receipt {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px 24px; overflow-x: auto;
      font-family: "Courier New", monospace; font-size: 13px; line-height: 1.45;
      color: var(--ink); margin: 0; box-shadow: var(--shadow);
    }

    /* ----------------------------------------------------------- karta */
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px 22px; margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 15px; }
    .fields label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px;
                    color: var(--muted); font-weight: 600; }
    .fields label.check { flex-direction: row; align-items: flex-start; gap: 10px;
                          grid-column: 1 / -1; font-weight: 400; color: var(--ink-soft);
                          font-size: 14px; }
    .fields label.check input { margin-top: 3px; }

    input, select, textarea {
      border: 1.5px solid var(--line-strong); border-radius: 10px;
      padding: 10px 12px; font-size: 15px; color: var(--ink);
      background: var(--surface); font-family: inherit; font-weight: 400;
      transition: border-color .12s, box-shadow .12s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--wine);
      box-shadow: 0 0 0 3px rgba(142,31,47,.10);
    }
    input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--wine); }

    button {
      margin-top: 14px; background: var(--wine); color: #fff; border: none;
      border-radius: 10px; padding: 11px 22px; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background .12s;
    }
    button:hover  { background: var(--wine-dark); }
    button:active { background: var(--wine-deep); }
    button.small  { margin: 0; padding: 7px 13px; font-size: 13px; border-radius: 8px; }
    button.ghost  {
      background: var(--surface); color: var(--ink-soft);
      border: 1.5px solid var(--line-strong);
    }
    button.ghost:hover { background: var(--surface-2); border-color: var(--muted); }
    button.gold { background: var(--gold); color: #3E2A06; }
    button.gold:hover { background: var(--gold-deep); color: #fff; }

    form.inline { display: inline-flex; gap: 6px; align-items: center; margin-left: 6px; }
    form.inline input, form.inline select {
      border: 1.5px solid var(--line-strong); border-radius: 8px;
      padding: 7px 10px; font-size: 13.5px; font-family: inherit;
    }

    code.token {
      font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 6px; padding: 3px 7px; color: var(--ink-soft);
      word-break: break-all; font-family: "IBM Plex Mono", "Courier New", monospace;
    }

    @media (max-width: 900px) {
      :root { --sidebar: 68px; }
      aside.nav .brand .name, aside.nav .brand .sub,
      aside.nav .group, aside.nav .foot, aside.nav a.item .txt { display: none; }
      aside.nav a.item { justify-content: center; padding: 13px 0; }
      .wrap { padding: 20px 16px 50px; }
      header.top { padding: 0 16px; }
    }
  </style>
</head>
<body>

<div class="shell">
  <aside class="nav">
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <div class="name">Sevimli Kassa</div>
        <div class="sub">boshqaruv paneli</div>
      </div>
    </div>

    <div class="group">Savdo</div>
    <a class="item {% block nav_points %}{% endblock %}" href="/">
      <span class="ico">◉</span><span class="txt">Bugungi savdo</span></a>
    <a class="item {% block nav_shifts %}{% endblock %}" href="/smenalar/">
      <span class="ico">▤</span><span class="txt">Smenalar</span></a>

    <div class="group">Sozlash</div>
    <a class="item {% block nav_registers %}{% endblock %}" href="/kassalar/">
      <span class="ico">▣</span><span class="txt">Kassalar</span></a>
    <a class="item {% block nav_releases %}{% endblock %}" href="/versiyalar/">
      <span class="ico">↥</span><span class="txt">Versiyalar</span></a>

    <div class="spacer"></div>
    <div class="foot">
      MoySklad bilan bog'langan<br>
      <a href="/chiqish/">Chiqish</a>
    </div>
  </aside>

  <main class="body">
    <header class="top">
      <span class="crumb">{% block crumb %}{% endblock %}</span>
      <span class="when">{% block when %}{% endblock %}</span>
    </header>
    <div class="wrap">
      {% block body %}{% endblock %}
    </div>
  </main>
</div>

</body>
</html>
