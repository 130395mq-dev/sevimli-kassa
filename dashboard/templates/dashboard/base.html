<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sevimli Kassa{% endblock %}</title>
  <style>
    :root {
      --bg: #F7F6F3;
      --surface: #FFFFFF;
      --text: #1C1517;
      --soft: #4C5754;
      --muted: #6B7672;
      --faint: #8A938F;
      --border: #E2E0DA;
      --line: #F0EFEA;
      --accent: #8E1F2F;
      --accent-pale: #FBF1F2;
      --danger: #B45309;
      --danger-bg: #FDF1E3;
      --warn: #8A5A12;
      --warn-bg: #FDF7EC;
      --ok: #1F7A4D;
      --ok-bg: #E4F4EC;
      --dark: #231318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 15px; line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .num { font-variant-numeric: tabular-nums; }

    header.top {
      background: var(--dark); color: #fff; padding: 0 24px;
      display: flex; align-items: center; gap: 28px; height: 56px;
    }
    header.top .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
    header.top nav { display: flex; gap: 22px; height: 100%; }
    header.top nav a {
      color: #A8B8B4; font-size: 14.5px; font-weight: 600;
      display: flex; align-items: center; border-bottom: 2px solid transparent;
      text-decoration: none;
    }
    header.top nav a.on { color: #fff; border-bottom-color: #E8909C; }
    header.top .spacer { flex-grow: 1; }
    header.top .when { color: #A8B8B4; font-size: 13.5px; }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 26px 24px 56px; }
    h1 { font-size: 23px; margin: 0 0 3px; letter-spacing: -.3px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    h2 { font-size: 16px; margin: 30px 0 12px; }

    .alert {
      border-radius: 12px; padding: 14px 18px; margin-bottom: 18px;
      font-size: 14.5px; display: flex; gap: 12px; align-items: flex-start;
    }
    .alert.err  { background: var(--danger-bg); border: 1px solid #EDD3B0; color: #7A4A0B; }
    .alert.warn { background: var(--warn-bg);  border: 1px solid #E8CFA3; color: #7A4A0B; }
    .alert.ok   { background: var(--ok-bg);    border: 1px solid #BEE3CF; color: #14603A; }
    .alert b { display: block; margin-bottom: 2px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 13px; }
    .tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 15px 17px;
    }
    .tile .label {
      font-size: 12px; font-weight: 700; letter-spacing: .6px;
      color: var(--faint); text-transform: uppercase;
    }
    .tile .value { font-size: 25px; font-weight: 700; margin-top: 5px; letter-spacing: -.5px; }
    .tile .note { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .tile.hero { background: var(--accent); border-color: var(--accent); }
    .tile.hero .label { color: #F2C9CE; }
    .tile.hero .value, .tile.hero .note { color: #fff; }
    .tile.hero .note { color: #F2C9CE; }

    table {
      width: 100%; border-collapse: collapse; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    th {
      text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .6px;
      color: var(--faint); text-transform: uppercase; padding: 11px 16px;
      background: #FBFAF7; border-bottom: 1.5px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    td.right, th.right { text-align: right; }
    tr.total td { background: #FBFAF7; font-weight: 700; border-top: 1.5px solid var(--border); }

    .badge {
      display: inline-block; font-size: 12.5px; font-weight: 600;
      padding: 2px 9px; border-radius: 5px; white-space: nowrap;
    }
    .badge.ok   { color: var(--ok);     background: var(--ok-bg); }
    .badge.warn { color: var(--warn);   background: #F7E7C8; }
    .badge.err  { color: #fff;          background: var(--danger); }
    .badge.off  { color: var(--muted);  background: #EDECE7; }

    .sec { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); padding: 22px; text-align: center; }
    pre.receipt {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 24px; overflow-x: auto;
      font-family: "Courier New", monospace; font-size: 13px; line-height: 1.45;
      color: var(--text); margin: 0;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px; margin-bottom: 8px;
    }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .fields label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
    .fields label.check { flex-direction: row; align-items: center; gap: 9px; grid-column: 1 / -1; }
    .fields input, .fields select {
      border: 1px solid var(--line-strong, #CFCEC6); border-radius: 8px;
      padding: 10px 12px; font-size: 15px; color: var(--text); background: #FBFAF7;
      font-family: inherit;
    }
    button {
      margin-top: 14px; background: var(--accent); color: #fff; border: none;
      border-radius: 9px; padding: 11px 22px; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    button.small { margin: 0; padding: 7px 12px; font-size: 13px; }
    button.ghost { background: #FBFAF7; color: var(--muted); border: 1px solid var(--border); }
    form.inline { display: inline-flex; gap: 6px; align-items: center; margin-left: 6px; }
    form.inline input { border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; font-family: inherit; }
    code.token {
      font-size: 12.5px; background: #FBFAF7; border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>

<header class="top">
  <span class="brand">Sevimli Kassa</span>
  <nav>
    <a href="/" class="{% block nav_points %}{% endblock %}">Nuqtalar</a>
    <a href="/smenalar/" class="{% block nav_shifts %}{% endblock %}">Smenalar</a>
    <a href="/kassirlar/" class="{% block nav_cashiers %}{% endblock %}">Kassirlar</a>
    <a href="/kassalar/" class="{% block nav_registers %}{% endblock %}">Kassalar</a>
  </nav>
  <span class="spacer"></span>
  <span class="when">{% block when %}{% endblock %}</span>
</header>

<div class="wrap">
  {% block body %}{% endblock %}
</div>

</body>
</html>
